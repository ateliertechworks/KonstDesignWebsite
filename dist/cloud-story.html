<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Konst Design — Cloud Story</title>

<!-- Same faces the rest of the Konst site uses. Drop this <link> if the host
     page already loads them. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
/* Demo-page reset only — the section itself needs none of this. Delete these
   two rules along with the .cs-pad blocks when you paste the section into the
   real page. */
html, body { margin: 0; }

/* =========================================================================
   KONST DESIGN — CLOUD STORY
   A scroll-driven projects section. Files float up through a sky of drifting
   white clouds; each one holds at centre long enough to be read, opens a
   detail card beneath itself, then scales past and blurs away as the next
   one arrives.

   Everything is prefixed .cs- so it can be pasted into an existing page
   without collisions.

   WHERE TO EDIT
     (a) cloud images ....... const CLOUD_SPRITES, bottom of this file
     (b) project photos ..... PROJECTS[].photo  in the data block below
     (c) detail + story copy  PROJECTS[].detail / .story  (marked PLACEHOLDER)
     (d) scroll length ...... const SCROLL_PER_PROJECT
   ========================================================================= */

.cs-wrap {
  /* --- palette ------------------------------------------------------- */
  --sky-top:    #b9d6ef;   /* pale daytime blue at the top of the frame   */
  --sky-mid:    #d9e8f6;
  --sky-low:    #eff5fb;
  --sky-floor:  #fdfaf6;   /* warm near-white at the horizon              */

  --ink:        #16140f;
  --ink-soft:   #4a443a;
  --ink-mute:   #837a6c;
  --clay:       #a9663f;

  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  /* --- geometry ------------------------------------------------------ */
  --card-w: min(30vw, 42svh, 380px);  /* the file at full size           */
  --card-y: 42%;                      /* where a file holds, vertically  */
  --detail-y: 69%;                    /* top of the detail box           */

  position: relative;
  overflow-x: hidden;                 /* drifting clouds must never widen the page */
  background: var(--sky-floor);
  color: var(--ink);
  font-family: var(--sans);
}

.cs-wrap *, .cs-wrap *::before, .cs-wrap *::after { box-sizing: border-box; }

/* --- the pinned frame ---------------------------------------------------- */
.cs-stage {
  position: relative;
  height: 100svh;
  overflow: hidden;
  isolation: isolate;
}

/* --- sky ----------------------------------------------------------------- */
.cs-sky {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(120% 70% at 50% 108%, rgba(255,247,236,.95) 0%, rgba(255,247,236,0) 62%),
    linear-gradient(180deg,
      var(--sky-top)   0%,
      var(--sky-mid)  34%,
      var(--sky-low)  64%,
      var(--sky-floor) 100%);
}

/* A slow warm bloom near the horizon so the sky is never flat. */
.cs-sun {
  position: absolute;
  left: 50%; bottom: -22vh;
  width: 90vw; height: 60vh;
  transform: translateX(-50%);
  background: radial-gradient(50% 50% at 50% 50%, rgba(255,236,214,.85), rgba(255,236,214,0) 70%);
  animation: cs-bloom 22s ease-in-out infinite alternate;
}
@keyframes cs-bloom { from { opacity: .55 } to { opacity: .95 } }

/* --- clouds -------------------------------------------------------------- */
/* Each .cs-cloud is a drifting track; the <img> inside it bobs on its own
   loop, so the two motions never sync up. Both are pure CSS and keep running
   while the page is still. */
.cs-clouds {
  position: absolute;
  inset: -12% -10%;
  pointer-events: none;
  will-change: transform;
}
.cs-cloud {
  position: absolute;
  left: 0;
  animation-name: cs-drift;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
.cs-cloud img {
  display: block;
  width: 100%;
  height: auto;
  animation-name: cs-bob;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
  animation-direction: alternate;
}
/* Fallback if a cloud image ever fails to load: soft layered puffs. */
.cs-cloud.is-fallback img { visibility: hidden; }
.cs-cloud.is-fallback {
  background:
    radial-gradient(42% 52% at 30% 62%, rgba(255,255,255,.96), rgba(255,255,255,0) 70%),
    radial-gradient(38% 60% at 55% 44%, rgba(255,255,255,.98), rgba(255,255,255,0) 72%),
    radial-gradient(46% 46% at 76% 66%, rgba(255,255,255,.92), rgba(255,255,255,0) 70%);
  filter: blur(2px);
}

@keyframes cs-drift {
  from { transform: translate3d(-46vw, 0, 0); }
  to   { transform: translate3d(126vw, 0, 0); }
}
@keyframes cs-bob {
  from { transform: translate3d(0, -1.1vh, 0) }
  to   { transform: translate3d(0,  1.4vh, 0) }
}

/* Per-cloud placement, size, speed and depth. Slower + bigger + more
   transparent = further away. Tweak freely. */
.cs-c1 { top:  4%; width: 46vw; opacity: .92; animation-duration: 96s;  animation-delay: -14s; }
.cs-c2 { top: 22%; width: 30vw; opacity: .78; animation-duration: 64s;  animation-delay: -38s; filter: blur(.4px); }
.cs-c3 { top: 46%; width: 58vw; opacity: .60; animation-duration: 148s; animation-delay: -90s; filter: blur(1.4px); }
.cs-c4 { top: 63%; width: 38vw; opacity: .85; animation-duration: 78s;  animation-delay: -52s; }
.cs-c5 { top: 12%; width: 24vw; opacity: .55; animation-duration: 122s; animation-delay: -70s; filter: blur(1.8px); }
.cs-c6 { top: 74%; width: 52vw; opacity: .95; animation-duration: 58s;  animation-delay: -20s; }
.cs-c7 { top: 34%; width: 20vw; opacity: .48; animation-duration: 134s; animation-delay: -104s; filter: blur(2.2px); }
/* Right-to-left drift for a couple of them, so the sky is not a conveyor belt. */
.cs-c3, .cs-c5 { animation-direction: reverse; }
.cs-c2 img { animation-duration: 13s; }
.cs-c4 img { animation-duration: 17s; }
.cs-c6 img { animation-duration: 21s; }
.cs-c1 img { animation-duration: 26s; }

/* --- section label / counter --------------------------------------------- */
.cs-label {
  position: absolute;
  top: clamp(18px, 4svh, 44px); left: clamp(18px, 5vw, 56px);
  z-index: 40;
  font-size: 12px;
  letter-spacing: .26em;
  text-transform: uppercase;
  color: rgba(22,20,15,.5);
}
.cs-counter {
  position: absolute;
  right: clamp(18px, 5vw, 56px); bottom: clamp(18px, 4svh, 44px);
  z-index: 40;
  display: flex; align-items: center; gap: 12px;
  font-size: 12px;
  letter-spacing: .2em;
  color: rgba(22,20,15,.55);
  font-variant-numeric: tabular-nums;
}
.cs-bar { position: relative; width: clamp(56px, 9vw, 120px); height: 1px; background: rgba(22,20,15,.18); }
.cs-bar i { position: absolute; inset: 0 auto 0 0; width: 0%; background: var(--clay); transition: width .2s linear; }

/* --- one project ---------------------------------------------------------- */
/* .cs-file is a full-frame layer that is never itself transformed, so the
   detail box and the story line stay crisp while the card zooms. */
.cs-file {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* the floating "file" ------------------------------------------------------ */
.cs-card {
  position: absolute;
  margin: 0;                 /* <figure> carries a 1em/40px UA margin */
  left: 50%; top: var(--card-y);
  width: var(--card-w);
  padding: 10px 10px 0;
  border-radius: 22px;
  background: #fff;
  box-shadow:
    0 2px 6px rgba(38,64,102,.10),
    0 18px 34px rgba(38,64,102,.14),
    0 54px 90px rgba(38,64,102,.22);
  transform-origin: 50% 50%;
  transform: translate(-50%, -50%) scale(.05);
  opacity: 0;
  will-change: transform, opacity, filter;
  backface-visibility: hidden;
}
.cs-shot {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  aspect-ratio: 4 / 3;
  background: linear-gradient(160deg, #e9e2d7, #cfc3b3);
}
.cs-shot img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* frosted icon chip, top-left of the photo */
.cs-chip {
  position: absolute;
  top: 10px; left: 10px;
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 11px;
  background: rgba(255,255,255,.62);
  border: 1px solid rgba(255,255,255,.8);
  backdrop-filter: blur(10px) saturate(1.3);
  -webkit-backdrop-filter: blur(10px) saturate(1.3);
  box-shadow: 0 4px 12px rgba(38,64,102,.14);
  color: var(--ink-soft);
}
.cs-chip svg { width: 17px; height: 17px; }

.cs-plate { padding: 14px 6px 16px; }
.cs-plate h3 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(19px, 1.5vw, 25px);
  line-height: 1.15;
  letter-spacing: .005em;
}
.cs-plate span {
  display: block;
  margin-top: 6px;
  font-size: 12px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink-mute);
}

/* the detail box that opens beneath a settled file -------------------------- */
.cs-detail {
  position: absolute;
  left: 50%; top: var(--detail-y);
  width: min(84vw, 460px);
  padding: 16px 22px 18px;
  border-radius: 18px;
  background: rgba(255,255,255,.66);
  border: 1px solid rgba(255,255,255,.8);
  backdrop-filter: blur(16px) saturate(1.25);
  -webkit-backdrop-filter: blur(16px) saturate(1.25);
  box-shadow: 0 20px 44px rgba(38,64,102,.16);
  transform: translate(-50%, 18px) scale(.96);
  opacity: 0;
  will-change: transform, opacity;
}
.cs-detail h4 {
  margin: 0 0 8px;
  font-size: 12px;
  letter-spacing: .24em;
  text-transform: uppercase;
  color: var(--clay);
  font-weight: 500;
}
.cs-detail p {
  margin: 0;
  font-size: clamp(13px, 1vw, 15px);
  line-height: 1.72;
  color: var(--ink-soft);
  font-weight: 300;
}

/* the story line floating in open sky -------------------------------------- */
.cs-cap {
  position: absolute;
  top: 13%;
  width: min(30vw, 340px);
  font-family: var(--display);
  font-style: italic;
  font-weight: 300;
  font-size: clamp(16px, 1.6vw, 26px);
  line-height: 1.45;
  color: rgba(22,20,15,.62);
  text-shadow: 0 1px 0 rgba(255,255,255,.7);
  opacity: 0;
  transform: translateY(14px);
  will-change: transform, opacity;
}
.cs-cap.is-left  { left: 5vw;  text-align: left; }
.cs-cap.is-right { right: 5vw; text-align: right; }

/* =========================================================================
   MOBILE — smaller file, fewer clouds, story line lifted clear of the card
   ========================================================================= */
@media (max-width: 640px) {
  .cs-wrap {
    --card-w: min(74vw, 40svh, 300px);
    --card-y: 40%;
    --detail-y: 64%;
  }
  .cs-c3, .cs-c5, .cs-c7 { display: none; }      /* keep the sky cheap */
  .cs-c1 { width: 74vw; }
  .cs-c2 { width: 56vw; }
  .cs-c4 { width: 66vw; }
  .cs-c6 { width: 82vw; }
  .cs-card { border-radius: 18px; }
  .cs-detail { width: 88vw; padding: 14px 18px 16px; }
  .cs-cap {
    top: 7%;
    left: 6vw; right: 6vw;
    width: auto;
    text-align: center;
  }
  .cs-cap.is-left, .cs-cap.is-right { left: 6vw; right: 6vw; text-align: center; }
}

/* =========================================================================
   REDUCED MOTION — no zoom, no drift. The files become a plain vertical
   list with every detail paragraph and story line already open.
   ========================================================================= */
.cs-reduced .cs-stage { height: auto; overflow: visible; padding: clamp(40px,8vh,90px) 0; }
.cs-reduced .cs-clouds,
.cs-reduced .cs-sun,
.cs-reduced .cs-counter { display: none; }
.cs-reduced .cs-sky { position: fixed; }
.cs-reduced .cs-files { position: relative; z-index: 5; }
.cs-reduced .cs-file {
  position: static;
  display: grid;
  justify-items: center;
  gap: 16px;
  max-width: 560px;
  margin: 0 auto;
  padding: clamp(28px,5vh,56px) 20px;
  pointer-events: auto;
}
.cs-reduced .cs-card,
.cs-reduced .cs-detail,
.cs-reduced .cs-cap {
  position: static;
  width: min(100%, 420px);
  transform: none !important;
  opacity: 1 !important;
  filter: none !important;
  visibility: visible !important;
}
.cs-reduced .cs-cap { text-align: center !important; order: -1; width: min(100%, 460px); }

@media (prefers-reduced-motion: reduce) {
  .cs-cloud, .cs-cloud img, .cs-sun { animation: none !important; }
}
</style>
</head>

<body>

<!-- Demo scaffolding only — delete the two .cs-pad blocks when you paste this
     section into the real page. They just give the pin something to sit
     between. -->
<div class="cs-pad" style="height:60svh;display:grid;place-items:center;font:300 14px/1.6 Inter,sans-serif;color:#857c6e;letter-spacing:.2em;text-transform:uppercase;background:#fbf9f5">scroll ↓</div>

<!-- =======================================================================
     THE SECTION
     ======================================================================= -->
<section class="cs-wrap" id="cloud-story" aria-label="Selected projects">
  <div class="cs-stage">

    <div class="cs-sky" aria-hidden="true"></div>
    <div class="cs-sun" aria-hidden="true"></div>

    <!-- (a) CLOUDS — src is filled in from CLOUD_SPRITES at the bottom of the
         file. To use your own artwork, either replace those data URIs or set
         these src attributes directly, e.g. src="img/clouds/cloud-a.webp".
         The four sprites shipped here were cut from the reference sky. -->
    <div class="cs-clouds" aria-hidden="true">
      <div class="cs-cloud cs-c1"><img alt="" data-cloud="a" /></div>
      <div class="cs-cloud cs-c2"><img alt="" data-cloud="b" /></div>
      <div class="cs-cloud cs-c3"><img alt="" data-cloud="c" /></div>
      <div class="cs-cloud cs-c4"><img alt="" data-cloud="d" /></div>
      <div class="cs-cloud cs-c5"><img alt="" data-cloud="b" /></div>
      <div class="cs-cloud cs-c6"><img alt="" data-cloud="a" /></div>
      <div class="cs-cloud cs-c7"><img alt="" data-cloud="c" /></div>
    </div>

    <p class="cs-label">Selected work</p>

    <!-- files are injected here -->
    <div class="cs-files" id="cs-files"></div>

    <div class="cs-counter" aria-hidden="true">
      <span id="cs-now">01</span>
      <span class="cs-bar"><i id="cs-bar"></i></span>
      <span id="cs-total">06</span>
    </div>

  </div>
</section>

<div class="cs-pad" style="height:70svh;background:#fbf9f5"></div>

<!-- GSAP + ScrollTrigger from cdnjs; Lenis from unpkg (cdnjs does not host
     it). Both are optional-safe: if a library is missing the section still
     renders as the reduced-motion list. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>

<script>
(function () {
  'use strict';

  /* =====================================================================
     (d) SCROLL LENGTH
     Pixels of scroll spent per project. Bigger = slower, longer hold,
     more time to read each file. 900 × 6 projects ≈ 5400px of scroll.
     Drop to ~600 for a brisker sequence.
     ===================================================================== */
  const SCROLL_PER_PROJECT = 900;

  /* How the timeline is carved up, in "project units" (0 → 1 per file). */
  const T = {
    inEnd:   0.30,   // speck → full size finishes here
    holdEnd: 0.72,   // the file sits still between inEnd and holdEnd — widen
                     // this window to give the detail box more reading time
    outEnd:  1.10,   // scaled past, blurred, gone
    speck:   0.05,   // starting scale
    past:    2.40,   // exit scale (it passes the camera)
    blur:    16,     // px of blur at the end of the exit
    lead:    0.32    // empty beat before the first file and after the last
  };

  /* =====================================================================
     CONTENT — 6 projects.
     (b) photo:  swap in the real project photograph.
     (c) detail / story: PLACEHOLDER COPY — written to read as one journey
         through a home, from the kitchen at dawn to the drawings that
         started it. Replace with the real project write-ups.
     ===================================================================== */
  const PROJECTS = [
    {
      title: 'Modular kitchen',
      place: 'Coimbatore residence',
      photo: 'img/interiors/kitchen.webp',
      icon: 'kitchen',
      /* PLACEHOLDER */ detail: 'A working kitchen for a family that cooks twice a day, every day. Handleless birch fronts, a quartz run deep enough for two people to stand side by side, and every jar within reach of where it is actually used. The tall pantry hides the clutter; the window keeps the steam moving.',
      /* PLACEHOLDER */ story: 'Every home we draw begins where the day begins — at six in the morning, with the first pot on the stove.'
    },
    {
      title: 'Pooja room',
      place: 'Dindigul villa',
      photo: 'img/interiors/pooja.webp',
      icon: 'flame',
      /* PLACEHOLDER */ detail: 'Carved teak doors on a quiet niche, lit from above so the brass catches without glare. The stone floor stays cool underfoot. Storage for lamps and camphor sits below the platform, out of sight, so the room holds nothing but stillness.',
      /* PLACEHOLDER */ story: 'A few steps further in, the house grows quiet. Some rooms are not designed to be used — only to be entered.'
    },
    {
      title: 'Master bedroom',
      place: 'Private client',
      photo: 'img/interiors/bedroom.webp',
      icon: 'bed',
      /* PLACEHOLDER */ detail: 'Warm oak, linen, and a headboard wall that softens the room acoustically as much as visually. Reading lights on separate switches, a wardrobe that opens without waking anyone, and blackout layers behind sheer curtains for afternoons off.',
      /* PLACEHOLDER */ story: 'Upstairs, the light turns low and private. This is the room the whole plan quietly protects.'
    },
    {
      title: 'TV unit + ceiling',
      place: 'Apartment fit-out',
      photo: 'img/interiors/tv-unit.webp',
      icon: 'tv',
      /* PLACEHOLDER */ detail: 'One continuous gesture from floor to ceiling: a fluted console, concealed cable routing, and a cove that washes the slab in warm light instead of pointing it at your eyes. The ceiling drop hides the ducting an old apartment never planned for.',
      /* PLACEHOLDER */ story: 'By evening everyone drifts to the same wall. We built it so the room gathers, not glares.'
    },
    {
      title: 'Visitors room',
      place: 'Villa project',
      photo: 'img/interiors/visitors.webp',
      icon: 'sofa',
      /* PLACEHOLDER */ detail: 'The room guests see first, so it carries the house. A low seating group in muted clay tones, a jaali screen that filters the west sun, and a floor plan that lets ten people sit without anyone shouting across the room.',
      /* PLACEHOLDER */ story: 'And when the doorbell goes, the house has one room already dressed and waiting.'
    },
    {
      title: '3D drawings',
      place: 'Concept stage',
      photo: 'img/projects/p6.webp',
      icon: 'cube',
      /* PLACEHOLDER */ detail: 'Before a single sheet is cut, the whole home is built once in 3D — materials, lighting temperature, sightlines from the doorway. Clients walk through it, change their minds freely, and only then do we order.',
      /* PLACEHOLDER */ story: 'All of it existed here first — in a drawing, at full scale, where changing your mind still costs nothing.'
    }
  ];

  /* Small stroke icons for the frosted chip. */
  const ICONS = {
    kitchen: '<path d="M3 3h18v6H3zM3 9v12M21 9v12M3 21h18M8 12v6M12 12v6M16 12v6"/>',
    flame:   '<path d="M12 3s5 4.2 5 8.6A5 5 0 0 1 7 11.6C7 7.2 12 3 12 3z"/><path d="M12 21v-3"/>',
    bed:     '<path d="M3 18v-8h18v8M3 18h18M3 14V6M7 10V8h5v2"/>',
    tv:      '<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8"/>',
    sofa:    '<path d="M4 11V8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3"/><path d="M2 12a2 2 0 0 1 4 0v4h12v-4a2 2 0 0 1 4 0v6H2z"/>',
    cube:    '<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>'
  };

  /* --------------------------------------------------------------------- */
  const wrap  = document.getElementById('cloud-story');
  const stage = wrap.querySelector('.cs-stage');
  const files = document.getElementById('cs-files');
  const nowEl = document.getElementById('cs-now');
  const barEl = document.getElementById('cs-bar');
  const N     = PROJECTS.length;

  document.getElementById('cs-total').textContent = String(N).padStart(2, '0');

  /* --- clouds: fill in the sprite srcs, fall back to CSS puffs ---------- */
  function paintClouds() {
    wrap.querySelectorAll('.cs-cloud img').forEach(function (img) {
      const src = (window.CLOUD_SPRITES || {})[img.dataset.cloud];
      img.addEventListener('error', function () { img.parentElement.classList.add('is-fallback'); });
      if (src) { img.src = src; } else { img.parentElement.classList.add('is-fallback'); }
    });
  }
  /* CLOUD_SPRITES is declared at the very bottom of the file, so read it only
     once the parser has reached it. */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', paintClouds);
  } else {
    paintClouds();
  }

  /* --- build the files -------------------------------------------------- */
  const nodes = PROJECTS.map(function (p, i) {
    const el = document.createElement('article');
    el.className = 'cs-file';
    /* Earlier files sit above later ones: the one scaling past the camera
       must pass in front of the one arriving behind it. */
    el.style.zIndex = String(10 + (N - i));
    el.innerHTML =
      '<figure class="cs-card">' +
        '<div class="cs-shot">' +
          '<img src="' + p.photo + '" alt="' + p.title + ' — ' + p.place + '" loading="lazy" decoding="async" />' +
          '<span class="cs-chip" aria-hidden="true">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" ' +
            'stroke-linecap="round" stroke-linejoin="round">' + (ICONS[p.icon] || ICONS.cube) + '</svg>' +
          '</span>' +
        '</div>' +
        '<figcaption class="cs-plate"><h3>' + p.title + '</h3><span>' + p.place + '</span></figcaption>' +
      '</figure>' +
      '<div class="cs-detail"><h4>' + p.place + '</h4><p>' + p.detail + '</p></div>' +
      '<p class="cs-cap ' + (i % 2 ? 'is-right' : 'is-left') + '">' + p.story + '</p>';
    files.appendChild(el);
    return {
      card:   el.querySelector('.cs-card'),
      detail: el.querySelector('.cs-detail'),
      cap:    el.querySelector('.cs-cap')
    };
  });

  /* --- guardrail: no motion, no libraries → plain readable list ---------- */
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced || !window.gsap || !window.ScrollTrigger) {
    wrap.classList.add('cs-reduced');
    return;
  }

  gsap.registerPlugin(ScrollTrigger);

  /* --- Lenis: momentum, so the slow zoom reads as glide not steps ------- */
  if (window.Lenis && !window.__lenis) {
    const lenis = new Lenis({ lerp: 0.085, wheelMultiplier: 0.9, smoothWheel: true });
    window.__lenis = lenis;
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(function (t) { lenis.raf(t * 1000); });
    gsap.ticker.lagSmoothing(0);
  }

  /* --- helpers ---------------------------------------------------------- */
  const clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  const lerp  = function (a, b, t) { return a + (b - a) * t; };
  const outCubic = function (t) { return 1 - Math.pow(1 - t, 3); };
  const inCubic  = function (t) { return t * t * t; };
  /* norm(v, a, b) → 0..1 across [a,b] */
  const norm = function (v, a, b) { return clamp((v - a) / (b - a), 0, 1); };

  /* --- the frame renderer ------------------------------------------------
     `p` is 0..1 across the whole pinned section. Each file gets its own
     local clock `ph`: 0 = starting to arrive, ~0.5 = settled at centre,
     1.1 = fully gone.
     ---------------------------------------------------------------------- */
  function render(p) {
    const t = p * (N + T.lead * 2) - T.lead;

    for (let i = 0; i < N; i++) {
      const n  = nodes[i];
      const ph = t - i;

      let scale, blur, ty, op;

      if (ph <= 0) {
        /* still a speck, waiting its turn */
        scale = T.speck; blur = 6; ty = 7; op = 0;
      } else if (ph < T.inEnd) {
        /* the slow zoom: eases out, so it decelerates into its hold */
        const e = outCubic(norm(ph, 0, T.inEnd));
        scale = lerp(T.speck, 1, e);
        blur  = lerp(6, 0, Math.min(1, e * 1.6));
        ty    = lerp(7, 0, e);
        op    = clamp(e * 3.2, 0, 1);
      } else if (ph < T.holdEnd) {
        /* HOLD — barely creeping, so it feels alive but stays readable */
        const e = norm(ph, T.inEnd, T.holdEnd);
        scale = lerp(1, 1.045, e);
        blur = 0; ty = 0; op = 1;
      } else if (ph < T.outEnd) {
        /* drifts back and past the camera, blurring out */
        const e = inCubic(norm(ph, T.holdEnd, T.outEnd));
        scale = lerp(1.045, T.past, e);
        blur  = lerp(0, T.blur, e);
        ty    = lerp(0, -7, e);
        op    = 1 - clamp(e * 1.25, 0, 1);
      } else {
        scale = T.past; blur = T.blur; ty = -7; op = 0;
      }

      const card = n.card;
      if (op < 0.004) {
        if (card.style.visibility !== 'hidden') card.style.visibility = 'hidden';
      } else {
        if (card.style.visibility === 'hidden') card.style.visibility = 'visible';
        card.style.transform = 'translate(-50%, calc(-50% + ' + ty.toFixed(2) + 'vh)) scale(' + scale.toFixed(4) + ')';
        card.style.opacity = op.toFixed(3);
        card.style.filter = blur > 0.05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none';
      }

      /* settled = 1 - |distance from centre|, flattened across the hold so
         the box is only fully open while the file is genuinely parked. The
         windows never overlap between neighbours, so two boxes can never be
         on screen at once. */
      const d = Math.abs(ph - 0.5);
      const settled = clamp((0.30 - d) / 0.10, 0, 1);
      const det = n.detail;
      if (settled < 0.004) {
        if (det.style.visibility !== 'hidden') det.style.visibility = 'hidden';
      } else {
        if (det.style.visibility === 'hidden') det.style.visibility = 'visible';
        det.style.opacity = settled.toFixed(3);
        det.style.transform = 'translate(-50%, ' + ((1 - settled) * 18).toFixed(2) + 'px) scale(' + (0.96 + 0.04 * settled).toFixed(3) + ')';
        det.style.pointerEvents = settled > 0.9 ? 'auto' : 'none';
      }

      /* the story line: tied to the same clock but with a wider window, so
         lines cross-fade in open sky rather than snapping */
      const prox = clamp(1 - d / 0.62, 0, 1);
      const cap = n.cap;
      if (prox < 0.004) {
        if (cap.style.visibility !== 'hidden') cap.style.visibility = 'hidden';
      } else {
        if (cap.style.visibility === 'hidden') cap.style.visibility = 'visible';
        cap.style.opacity = Math.pow(prox, 0.75).toFixed(3);
        cap.style.transform = 'translateY(' + ((1 - prox) * 14).toFixed(2) + 'px)';
      }
    }

    /* counter — whole numbers only */
    const idx = clamp(Math.floor(t) + 1, 1, N);
    const shown = String(Math.round(idx)).padStart(2, '0');
    if (nowEl.textContent !== shown) nowEl.textContent = shown;
    barEl.style.width = Math.round(clamp(p, 0, 1) * 100) + '%';
  }

  /* --- pin + scrub ------------------------------------------------------ */
  const drive = { p: 0 };

  gsap.timeline({
    scrollTrigger: {
      trigger: wrap,
      start: 'top top',
      end: '+=' + (SCROLL_PER_PROJECT * N),   /* (d) total scroll distance */
      pin: stage,
      pinSpacing: true,
      anticipatePin: 1,
      scrub: 0.7,                              /* the buttery part */
      invalidateOnRefresh: true
    }
  }).to(drive, {
    p: 1,
    ease: 'none',
    duration: 1,
    onUpdate: function () { render(drive.p); }
  });

  /* A subtle vertical parallax on the whole cloud layer. The drift and bob
     keyframes keep running underneath it, untouched by scroll. */
  gsap.to('.cs-clouds', {
    yPercent: -6,
    ease: 'none',
    scrollTrigger: { trigger: wrap, start: 'top top', end: '+=' + (SCROLL_PER_PROJECT * N), scrub: 1 }
  });

  render(0);
  window.addEventListener('load', function () { ScrollTrigger.refresh(); });
})();
</script>
